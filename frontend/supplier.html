<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Supplier Dashboard — SupplyChain DApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="logo-dot"></span> SupplyChain</a>
  <nav class="role-nav">
    <a href="index.html">Home</a>
    <a href="manufacturer.html">Manufacturer</a>
    <a href="supplier.html" class="active">Supplier</a>
    <a href="delivery.html">Delivery</a>
    <a href="customer.html">Customer</a>
  </nav>
  <div class="wallet-box">
    <span id="walletPill" class="pill" style="display:none;"></span>
    <button id="connectBtn" class="btn btn-primary">Connect MetaMask</button>
  </div>
</header>

<div class="container">

  <div class="hero" style="padding-top:0;">
    <h1>📦 Supplier Dashboard</h1>
    <p class="lead">Products currently assigned to your address, and a form to move any product to its next stage.</p>
  </div>

  <div class="section card">
    <div class="panel-title">Advance a product's status</div>
    <div class="field">
      <label for="uId">Product ID</label>
      <input id="uId" type="number" min="1" placeholder="e.g. 1" />
    </div>
    <div class="row">
      <div class="field">
        <label for="uStatus">New status</label>
        <select id="uStatus"></select>
      </div>
      <div class="field">
        <label for="uLoc">Location</label>
        <input id="uLoc" type="text" placeholder="e.g. Chennai Warehouse" />
      </div>
    </div>
    <div class="field">
      <label for="uNext">Next owner address</label>
      <input id="uNext" type="text" placeholder="0x… (delivery person's wallet, or 0x000…000 if none yet)" />
    </div>
    <button id="updateBtn" class="btn btn-primary">Update Status</button>
    <div id="updateStatus" class="status-line"></div>
  </div>

  <div class="section">
    <div class="panel-title">Products Assigned To Me</div>
    <div id="productList"></div>
    <button id="refreshBtn" class="btn">Refresh list</button>
  </div>

</div>

<script src="js/contract-config.js"></script>
<script src="js/app-common.js"></script>
<script>
  const statusSelect = document.getElementById("uStatus");
  STATUS_LABELS.forEach((label, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = label;
    statusSelect.appendChild(opt);
  });
  statusSelect.value = STATUS.WITH_SUPPLIER;

  document.getElementById("updateBtn").addEventListener("click", async () => {
    if (!requireContract()) return;
    const statusEl = document.getElementById("updateStatus");
    const id = Number(document.getElementById("uId").value);
    const newStatus = Number(statusSelect.value);
    const loc = document.getElementById("uLoc").value.trim();
    const next = document.getElementById("uNext").value.trim() || "0x0000000000000000000000000000000000000000";
    if (!id || !loc) {
      setStatus(statusEl, "Product ID and location are required.", "error");
      return;
    }
    try {
      setStatus(statusEl, "Confirm the transaction in MetaMask…");
      const tx = await contract.updateStatus(id, newStatus, loc, next);
      setStatus(statusEl, "Waiting for confirmation… (" + tx.hash + ")");
      await tx.wait();
      setStatus(statusEl, "Status updated!", "ok");
      loadMyProducts();
    } catch (err) {
      console.error(err);
      setStatus(statusEl, "Transaction failed: " + (err.reason || err.message || err), "error");
    }
  });

  document.getElementById("refreshBtn").addEventListener("click", loadMyProducts);

  async function loadMyProducts() {
    if (!requireContract()) return;
    const listEl = document.getElementById("productList");
    listEl.innerHTML = '<p class="status-line">Loading…</p>';
    try {
      const count = Number(await contract.productCount());
      const mine = [];
      for (let id = 1; id <= count; id++) {
        const p = await contract.getProduct(id);
        const me = currentAccount.toLowerCase();
        if (p.supplier.toLowerCase() === me || p.currentOwner.toLowerCase() === me) {
          mine.push(p);
        }
      }
      if (mine.length === 0) {
        listEl.innerHTML = '<p class="status-line">No products assigned to this address yet.</p>';
        return;
      }
      listEl.innerHTML = "";
      for (const p of mine) {
        const history = await contract.getProductHistory(p.id);
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-card-head">
            <div>
              <h3>#${p.id} — ${escapeHtml(p.name)}</h3>
              <p>${escapeHtml(p.description)}</p>
            </div>
            <span class="badge">${STATUS_LABELS[Number(p.status)] || "Unknown"}</span>
          </div>
          <div class="addr-grid">
            <div><span class="k">Manufacturer:</span> <code>${shortAddr(p.manufacturer)}</code></div>
            <div><span class="k">Current owner:</span> <code>${shortAddr(p.currentOwner)}</code></div>
          </div>
          <div class="timeline-container"></div>
        `;
        listEl.appendChild(card);
        renderTimeline(card.querySelector(".timeline-container"), history, Number(p.status));
      }
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<p class="status-line error">Could not load products: ' + (err.message || err) + "</p>";
    }
  }

  initWalletUI(loadMyProducts);
</script>
</body>
</html>
