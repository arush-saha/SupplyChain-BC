<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Track an Order — SupplyChain DApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="logo-dot"></span> SupplyChain</a>
  <nav class="role-nav">
    <a href="index.html">Home</a>
    <a href="manufacturer.html">Manufacturer</a>
    <a href="supplier.html">Supplier</a>
    <a href="delivery.html">Delivery</a>
    <a href="customer.html" class="active">Customer</a>
  </nav>
  <div class="wallet-box">
    <span id="walletPill" class="pill" style="display:none;"></span>
    <button id="connectBtn" class="btn btn-primary">Connect MetaMask</button>
  </div>
</header>

<div class="container">

  <div class="hero" style="padding-top:0;">
    <h1>🧾 Track an Order</h1>
    <p class="lead">Enter a product ID to see its full journey through the supply chain.</p>
  </div>

  <div class="section card">
    <div class="row" style="align-items:flex-end;">
      <div class="field">
        <label for="trackId">Product ID</label>
        <input id="trackId" type="number" min="1" placeholder="e.g. 1" />
      </div>
      <div class="field">
        <button id="trackBtn" class="btn btn-primary btn-block">Track</button>
      </div>
    </div>
    <div id="trackStatus" class="status-line"></div>
  </div>

  <div id="resultArea" class="section"></div>

</div>

<script src="js/contract-config.js"></script>
<script src="js/app-common.js"></script>
<script>
  document.getElementById("trackBtn").addEventListener("click", trackProduct);
  document.getElementById("trackId").addEventListener("keydown", (e) => {
    if (e.key === "Enter") trackProduct();
  });

  async function trackProduct() {
    if (!requireContract()) return;
    const statusEl = document.getElementById("trackStatus");
    const resultArea = document.getElementById("resultArea");
    const id = Number(document.getElementById("trackId").value);
    if (!id) {
      setStatus(statusEl, "Enter a product ID.", "error");
      return;
    }
    resultArea.innerHTML = "";
    try {
      setStatus(statusEl, "Looking up product #" + id + "…");
      const p = await contract.getProduct(id);
      const history = await contract.getProductHistory(id);
      setStatus(statusEl, "", "");

      const isMine = p.currentOwner.toLowerCase() === currentAccount.toLowerCase();
      const isDelivered = Number(p.status) === STATUS.DELIVERED;

      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML = `
        <div class="product-card-head">
          <div>
            <h3>#${p.id} — ${escapeHtml(p.name)}</h3>
            <p>${escapeHtml(p.description)}</p>
          </div>
          <span class="badge">${STATUS_LABELS[Number(p.status)] || "Unknown"}</span>
        </div>
        <div class="addr-grid">
          <div><span class="k">Manufacturer:</span> <code>${shortAddr(p.manufacturer)}</code></div>
          <div><span class="k">Supplier:</span> <code>${isZeroAddr(p.supplier) ? "—" : shortAddr(p.supplier)}</code></div>
          <div><span class="k">Delivery:</span> <code>${isZeroAddr(p.deliveryPerson) ? "—" : shortAddr(p.deliveryPerson)}</code></div>
          <div><span class="k">Current owner:</span> <code>${shortAddr(p.currentOwner)}</code></div>
        </div>
        <div class="timeline-container"></div>
        ${
          isMine && !isDelivered
            ? '<button id="confirmBtn" class="btn btn-primary" style="margin-top:16px;">Confirm Receipt</button>'
            : ""
        }
      `;
      resultArea.appendChild(card);
      renderTimeline(card.querySelector(".timeline-container"), history, Number(p.status));

      const confirmBtn = card.querySelector("#confirmBtn");
      if (confirmBtn) {
        confirmBtn.addEventListener("click", async () => {
          try {
            setStatus(statusEl, "Confirm the transaction in MetaMask…");
            const tx = await contract.updateStatus(
              id,
              STATUS.DELIVERED,
              "Received by customer",
              "0x0000000000000000000000000000000000000000"
            );
            setStatus(statusEl, "Waiting for confirmation… (" + tx.hash + ")");
            await tx.wait();
            setStatus(statusEl, "Receipt confirmed!", "ok");
            trackProduct();
          } catch (err) {
            console.error(err);
            setStatus(statusEl, "Transaction failed: " + (err.reason || err.message || err), "error");
          }
        });
      }
    } catch (err) {
      console.error(err);
      setStatus(statusEl, "Couldn't find that product: " + (err.reason || err.message || err), "error");
    }
  }

  initWalletUI();
</script>
</body>
</html>
